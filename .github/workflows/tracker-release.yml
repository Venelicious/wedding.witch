name: Publish tested PopTracker pack
on:
  push:
    branches: [main]
    paths: ['poptracker/**', 'tracker-release/**', 'tools/build_tracker.py', 'tests/test_tracker.py', '.github/workflows/tracker-release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wedding-witch-tracker-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.13'
      - name: Build and test pack
        run: |
          python -m pip install Pillow==11.3.0 lupa==2.6
          VERSION=$(python -c "import json; print(json.load(open('poptracker/manifest.json'))['package_version'])")
          cp "tracker-release/WeddingWitch-PopTracker-$VERSION.zip" "$RUNNER_TEMP/committed-pack.zip"
          python tools/build_tracker.py
          cmp --silent "$RUNNER_TEMP/committed-pack.zip" "tracker-release/WeddingWitch-PopTracker-$VERSION.zip"
          git diff --exit-code -- poptracker
          python -m unittest discover -s tests -p test_tracker.py -v
          grep -q "^# Wedding Witch PopTracker $VERSION$" tracker-release/RELEASE-NOTES.md
      - name: Publish tracker release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python -c "import json; print(json.load(open('poptracker/manifest.json'))['package_version'])")
          TAG="tracker-v$VERSION"
          PACK="WeddingWitch-PopTracker-$VERSION.zip"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern "$PACK" --dir "$RUNNER_TEMP/published-tracker"
            cmp --silent "tracker-release/$PACK" "$RUNNER_TEMP/published-tracker/$PACK"
            gh release edit "$TAG" --notes-file tracker-release/RELEASE-NOTES.md
          else
            gh release create "$TAG" "tracker-release/$PACK" --target "$GITHUB_SHA" --prerelease --latest=false --title "Wedding Witch PopTracker $VERSION" --notes-file tracker-release/RELEASE-NOTES.md
          fi
