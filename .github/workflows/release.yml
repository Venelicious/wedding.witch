name: Publish tested release
on:
  push:
    branches: [main]
    paths: ['release/**', 'RELEASE-NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: wedding-witch-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify release artifacts
        run: python3 tools/verify_release.py
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('release/manifest.json'))['version'])")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Correct notes only when this version's immutable artifacts match.
            gh release download "$TAG" --pattern manifest.json --dir "$RUNNER_TEMP/published-manifest"
            if ! cmp --silent release/manifest.json "$RUNNER_TEMP/published-manifest/manifest.json"; then
              echo "Release manifest differs; refusing to replace immutable assets."
              exit 1
            fi
            gh release edit "$TAG" --notes-file RELEASE-NOTES.md
            exit 0
          fi
          gh release create "$TAG" "release/WeddingWitch-AP-$VERSION-Windows.zip" release/wedding_witch.apworld release/WeddingWitch.yaml release/manifest.json --target "$GITHUB_SHA" --prerelease --title "Wedding Witch Archipelago $VERSION" --notes-file RELEASE-NOTES.md
